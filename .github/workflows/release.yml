name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release from the Actions tab (or the API): creates the v<version> tag on the chosen commit.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal metadata.json KPlugin.Version), e.g. 2.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match metadata.json version
        env:
          REF_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          VERSION=$(node -e 'process.stdout.write(require("./package/metadata.json").KPlugin.Version)')
          TAG="${REF_TAG#v}"
          echo "RELEASE_TAG=$REF_TAG" >> "$GITHUB_ENV"
          # pre-release tags (v1.0.0-rc1) must start with the metadata version
          case "$TAG" in
            "$VERSION"|"$VERSION"-*) echo "version ok: $VERSION ($REF_TAG)" ;;
            *) echo "::error::tag $REF_TAG does not match metadata.json version $VERSION"; exit 1 ;;
          esac
      - name: Unit tests
        run: npm test
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Build .plasmoid
        run: scripts/package.sh
      - name: Release notes from CHANGELOG
        run: |
          VERSION=$(node -e 'process.stdout.write(require("./package/metadata.json").KPlugin.Version)')
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.plasmoid
          body_path: release-notes.md
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
